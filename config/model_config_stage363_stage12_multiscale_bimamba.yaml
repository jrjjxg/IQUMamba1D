model_config:
  model_type: bimamba_multiscale

  # Strict Stage-12 geometry: four U-Net stages, upgraded cores at 1 and 3.
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  bimamba_apply_stages: [1, 3]
  bimamba_residual_scale_init: 1.0

  # Preserve the original two global scans and add routed local widths 3/7/15.
  multiscale_d_state: 16
  multiscale_global_d_conv: 4
  multiscale_expand: 2
  multiscale_local_kernels: [3, 7, 15]
  multiscale_local_scale_init: 0.1
