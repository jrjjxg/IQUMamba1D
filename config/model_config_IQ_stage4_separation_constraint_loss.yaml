# IQUMamba1D Stage 195 - separation-mechanism auxiliary loss.
# Opposed ablation: same backbone as stage 4, target-free output constraint.
model_config:

  model_type: iqumamba
  input_channels: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  num_classes: 4
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  sep_constraint_weight: 0.05
  sep_constraint_mix_weight: 1.0
  sep_constraint_corr_weight: 1.0
  sep_constraint_energy_weight: 0.1

  topology_aux_weight: 0.0
