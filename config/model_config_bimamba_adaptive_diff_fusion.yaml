model_config:
  model_type: bimamba_adaptive_diff_fusion

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Match baseline stage-12 placement; only the fusion rule is adaptive.
  bimamba_apply_stages: [1, 3]
  bimamba_residual_scale_init: 0.01
  bimamba_diff_scale_init: 0.25
  bimamba_gate_logit_init: -1.5
  bimamba_gate_token_scale_init: 1.0
  bimamba_gate_eps: 1.0e-6
