model_config:
  model_type: resunet1d_strong_prior

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Strong Prior configuration
  adapter_channels: 32
  adapter_max_scale: 0.5
  adapter_scale_init: 0.0
  adapter_temperature: 1.0
