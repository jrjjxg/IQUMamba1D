# Stage376: Stage56 (pure residual 1D U-Net) + Stage371-style real latent mask.
# No Mamba, token routing, or ASC is present in this model.
model_config:
  model_type: resunet1d_noasc_latent_mask_real
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  latent_mask_mode: real
  latent_mask_eps: 1.0e-6
