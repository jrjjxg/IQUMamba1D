# Stage317: full Stage309 and Stage310 placements; FDConv then UniRepLK at stage0.
model_config:
  model_type: iqumamba_fdconv_unirep_ablation
  rf_variant: serial
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  rf_residual_scale_init: 0.05
  fdconv_kernel_size: 31
  fdconv_bands: 4
  unireplk_large_kernel: 17
  unireplk_ffn_factor: 4
  unireplk_layer_scale: 1.0e-6
