# IQUMamba1D_CyclicCorr - stage-4 IQUMamba with a mixture-estimated
# cyclic-correlation adapter.  This variant does not read samples-per-symbol
# metadata.  It estimates a dominant cyclic frequency from the received mixture
# and computes compact R_x^alpha(tau)-style statistics to condition a light
# complex residual adapter before the unchanged IQUMamba backbone.

model_config:
  model_type: iqumamba_cycliccorr

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Search bounds in normalized cycles/sample.  The estimator uses only x=(I,Q).
  cycliccorr_min_freq: 0.015625
  cycliccorr_max_freq: 0.125
  cycliccorr_default_freq: 0.03125
  cycliccorr_momentum: 0.05
  cycliccorr_lags: [0, 1, 2, 4, 8]
  cycliccorr_hidden_channels: 8
  cycliccorr_kernel_size: 9
  cycliccorr_scale_init: 0.01
  cycliccorr_gate_hidden: 16
  cycliccorr_zero_init: true
