# Stage 286 (C4): fully strict complex 20-block WaveNet, including complex
# residual/skip paths and an interleaved complex source-output projection.
model_config:
  model_type: icassp_complex_wavenet
  input_channels: 2
  num_classes: 2
  residual_channels: 128
  residual_layers: 20
  dilation_cycle_length: 10
  complex_layers: 20
  strict_complex_output: true
  use_conjugate_adapter: false
  complex_norm_enable: false
  complex_norm_eps: 1.0e-6
