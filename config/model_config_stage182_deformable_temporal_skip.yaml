model_config:
  model_type: resunet1d_deformable_temporal_skip

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  residual_scale_init: 0.1
  sampling_offsets: 4
  offset_kernel_size: 5
  offset_range: 8.0
