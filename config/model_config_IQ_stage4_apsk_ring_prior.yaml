# IQUMamba1D_APSKRingPrior - stage-4 IQUMamba with an APSK ring-radius input adapter.
# Intended for APSK or QPSK+APSK datasets with persistent radius-ring structure.

model_config:
  model_type: iqumamba_apsk_ring_prior

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  apsk_prior_hidden_channels: 8
  apsk_prior_ring_radii: [0.40, 1.13]
  apsk_prior_temperature: 18.0
  apsk_prior_kernel_size: 9
  apsk_prior_scale_init: 0.01
  apsk_prior_reliability_floor: 0.05
  apsk_prior_zero_init: true
