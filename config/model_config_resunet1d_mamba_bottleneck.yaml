# Stage 97 - stage42 ResUNet with a minimal bottleneck Mamba adapter.
#
# Motivation:
#   Keep the pure-convolution stage42 encoder/decoder intact and add one
#   long-range temporal Mamba residual at the lowest-resolution bottleneck.

model_config:
  model_type: resunet1d_mamba_bottleneck

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  mamba_embed_stages: [4]
  mamba_embed_d_state: 16
  mamba_embed_d_conv: 4
  mamba_embed_expand: 2
  mamba_embed_scale_init: 0.01
  mamba_embed_local_kernel_size: 7
  mamba_embed_gate_hidden: 64
