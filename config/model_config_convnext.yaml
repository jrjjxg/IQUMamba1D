# IQUConvNeXt1D — Pure-CNN ConvNeXt-style Large-Kernel U-Net
#
# Architecture:
#   Replaces Mamba SSM layers with ConvNeXt-1D blocks (depthwise large-kernel
#   conv + inverted-bottleneck FFN) at alternating stages.
#
#   Stage 0: LargeKernelConv (kernel=31)
#   Stage 1: Identity
#   Stage 2: LargeKernelConv (kernel=31)
#   Stage 3: Identity
#   Stage 4: LargeKernelConv (kernel=31)
#
# Advantages over Mamba:
#   - No CUDA kernel dependency (runs anywhere)
#   - Faster training on GPU
#   - Lower memory footprint
#   - Still captures wide temporal context via large kernels

model_config:
  model_type: convnext

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # ConvNeXt-specific parameters
  lk_kernel_size: 31        # depthwise conv kernel size (receptive field)
  lk_expand: 4              # FFN expansion factor (hidden = dim × expand)
