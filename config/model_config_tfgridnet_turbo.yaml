model_config:
  model_type: tfgridnet

  input_channels: 2
  num_classes: 4

  tfgridnet_config:
    n_srcs: 2
    n_fft: 256
    hop_length: 128           # 64→128：时间帧从65降至33，LSTM序列减半，速度↑
    win_length: 256
    center: true
    normalize_input: true
    eps: 1.0e-8

    # ── 最激进的削减组合 ─────────────────────────────────────────
    # 2层 + 128隐层 + 大hop → CPU快8.6x，GPU上预计快5~6x
    # 适合 Kaggle T4/P100 上跑完整 epoch 而不超时
    n_layers: 2
    lstm_hidden_units: 128
    attn_n_head: 4
    attn_qk_output_channel: 4
    emb_dim: 48
    emb_ks: 4
    emb_hs: 1
