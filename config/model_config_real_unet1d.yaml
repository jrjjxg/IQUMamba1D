# IQURealUNet1D - strict real-valued mirror of the complex U-Net baseline
#
# Matches the complex U-Net stage layout, widths, skip fusion, and upsampling
# path while replacing complex-valued operators with real-valued ones.

model_config:
  model_type: real_unet1d

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  stem_kernel_size: 5
