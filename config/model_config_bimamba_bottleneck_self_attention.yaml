# Stage 245: Stage 12 + PreNorm self-attention after Stage-3 BiMamba.
model_config:
  model_type: bimamba_bottleneck_self_attention
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  bottleneck_attention_stage: 3
  bottleneck_attention_num_heads: 4
  bottleneck_attention_dropout: 0.0
  bottleneck_attention_scale_init: 1.0
