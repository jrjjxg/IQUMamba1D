# Stage 243: Stage 12 + phase-equivariant complex Hermitian input fusion.
model_config:
  model_type: bimamba_phase_equivariant_fusion
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  phase_fusion_kv_tokens: 32
  phase_fusion_num_heads: 4
  phase_fusion_head_dim: 8
  phase_fusion_dropout: 0.0
  phase_fusion_scale_init: 0.01
