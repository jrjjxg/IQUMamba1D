# Stage 101 - stage42 ResUNet with local complex-correlation skip gates.

model_config:
  model_type: resunet1d_corrgate

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  pco_phase_channels: 16
  pco_phase_kernel_size: 7
  pco_phase_scale_init: 0.01
  pco_corr_lags: [1, 2, 4, 8]
  pco_corr_window: 33
  pco_corr_scale_init: 0.01
  pco_orth_scale_init: 0.01
  pco_orth_eps: 1.0e-5
