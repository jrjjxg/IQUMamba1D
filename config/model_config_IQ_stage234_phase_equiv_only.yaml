# Stage 234 ablation: stage-4 IQUMamba + shared-IQ norm/phase equivariance only.
model_config:
  model_type: iqumamba_shared_iq_norm
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  iq_power_norm_eps: 1.0e-6
  iq_power_norm_detach_scale: false
  phase_equiv_enable: true
  phase_equiv_probability: 0.25
  phase_equiv_supervised_weight: 0.25
  phase_equiv_consistency_weight: 0.1
  phase_equiv_max_degrees: 180.0
  phase_equiv_beta: 0.5
  phase_equiv_eps: 1.0e-8

  cross_snr_enable: false
  confidence_soft_pit_enable: false
  receiver_symbol_weight: 0.0
