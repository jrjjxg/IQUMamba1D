model_config:
  model_type: iqumamba_spectral_lowrank_encoder

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  use_complex_mask: false

  # Low-rank FNO-style spectral mixer for reducing stage179 overfitting.
  mode_count: 32
  spectral_rank: 4
  dropout: 0.10
  residual_scale_init: 0.02
