# Stage 220: Stage 219 plus training-only shared-permutation multi-scale supervision.
model_config:
  model_type: iqumamba_pr_shared_perm
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: true
  training_only_deep_supervision: true

  shared_permutation_multiscale_enable: true
  shared_permutation_multiscale_weight: 0.2
  shared_permutation_multiscale_weights: [1.0, 0.5, 0.25]

