# IQUResUNet1D - Pure convolutional 1D U-Net baseline
#
# Architecture:
#   Keeps the encoder/decoder skeleton, residual blocks, skip refinement,
#   and output heads aligned with IQUMamba1D, while removing all Mamba/SSM
#   layers. This makes it a fair pure-convolution baseline.

model_config:
  model_type: resunet1d

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
