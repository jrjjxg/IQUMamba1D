# Stage 365: Stage-364 independent complex BiMamba + Stage-310 UniRepLK.
# The U-Net remains four stages. UniRepLK and the memory slot read the same
# convolutional feature, then only the UniRepLK delta is added to memory output.
model_config:
  model_type: bimamba_complex_state_independent_unireplk

  # Strict Stage-12 geometry and Stage-364 memory placement.
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  bimamba_apply_stages: [1, 3]
  bimamba_residual_scale_init: 1.0

  # Two independent Stage-295 complex SSM directions (Stage 364).
  complex_state_d_state: 8
  complex_state_d_conv: 4
  complex_state_expand: 2
  complex_state_scan_checkpoint: true
  complex_state_scan_backend: auto
  complex_state_fusion_hidden: 64

  # Stage-310 UniRepLK placement/settings, used as parallel delta branches.
  rf_residual_scale_init: 0.05
  rf_apply_stages: [0, 1, 2]
  rf_large_kernel: 17
  rf_ffn_factor: 4
  rf_layer_scale: 1.0e-6
