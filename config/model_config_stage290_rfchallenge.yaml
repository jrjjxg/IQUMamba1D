# RF Challenge adaptation of Stage 290: strict-complex C1 stem with the
# otherwise unchanged real Stage-4 IQUMamba backbone.
model_config:
  model_type: iqumamba_stage4_complex_c1
  input_channels: 2
  num_classes: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  complex_norm_eps: 1.0e-6
