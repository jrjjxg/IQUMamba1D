model_config:
  model_type: bimamba_complex_diff_shared
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  bimamba_apply_stages: [3]
  bimamba_residual_scale_init: 0.1
  bimamba_complex_diff_gate_init: 0.2
  bimamba_complex_diff_stride: 2
  bimamba_complex_diff_eps: 1.0e-6
