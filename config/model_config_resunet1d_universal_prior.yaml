# Universal Multi-Source Receiver-Prior Adapter v1 (MVP)
# This model uses the Stage 56 ResUNet1D_NoASC backbone but introduces a multi-hypothesis,
# confidence-gated receiver prior adapter at the front end.

model_config:
  model_type: resunet1d_universal_prior

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false
  use_complex_mask: false

  # Universal Prior Adapter Configuration
  universal_prior_min_freq: 0.015625 # 1/64
  universal_prior_max_freq: 0.125    # 1/8
  universal_prior_top_k: 3
  universal_prior_rolloffs: [0.2, 0.35, 0.5]
  universal_prior_rrc_kernel_size: 31
  universal_prior_fresh_kernel_size: 9
  universal_prior_hidden_channels: 16
  universal_prior_gate_hidden: 16
  universal_prior_scale_init: 0.01
