# IQUResUNet1D_SkipEnhanced (Attention U-Net Style)

model_config:
  model_type: resunet1d_skip_enhanced_attention

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Skip hyperparameters
  residual_scale_init: 0.1
  attn_dim: 64
  num_heads: 4
  max_tokens: 256
