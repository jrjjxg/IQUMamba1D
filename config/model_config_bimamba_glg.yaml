model_config:
  model_type: bimamba_glg

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Variant 2+3: y = x + alpha * (gate_local * LocalConv + gate_global * BiMamba)
  mamba_residual_scale_init: 0.1
  local_kernel_size: 7
  local_global_gate_hidden: 64
