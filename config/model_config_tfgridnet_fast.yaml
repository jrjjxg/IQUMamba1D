model_config:
  model_type: tfgridnet

  input_channels: 2
  num_classes: 4

  tfgridnet_config:
    n_srcs: 2
    n_fft: 256
    hop_length: 64
    win_length: 256
    center: true
    normalize_input: true
    eps: 1.0e-8

    # ── 核心优化 ──────────────────────────────────────────────────
    # 原始: n_layers=6, lstm_hidden=192, attn_n_head=4, emb_dim=48
    # 每减少1层 Layer：整体速度约提升 15~20%
    # lstm_hidden 从 192→96：LSTM 计算量降低约 75% (O(hidden^2))
    n_layers: 3
    lstm_hidden_units: 96
    attn_n_head: 2            # 注意力头数减半，适合你的双源分离任务
    attn_qk_output_channel: 4
    emb_dim: 32               # 嵌入维度适当缩小
    emb_ks: 4
    emb_hs: 1
