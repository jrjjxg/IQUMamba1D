model_config:
  model_type: resunet1d_skip_enhanced_lssg_channel_mamba

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Encoder BiMamba configuration
  use_mamba_stages: [false, false, true, true, false]
  mamba_residual_scale_init: 0.0

  # Decoder LSSG
  residual_scale_init: 0.1