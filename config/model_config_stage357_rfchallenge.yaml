# RF Challenge Stage 357: fully strict-complex U-Net + strict-complex S4D.
model_config:
  model_type: iqumamba_stage4_complex_s4d
  input_channels: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  num_classes: 2
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  complex_norm_eps: 1.0e-6
  memory_d_state: 64
  memory_dropout: 0.0
  memory_dt_min: 0.001
  memory_dt_max: 0.1
