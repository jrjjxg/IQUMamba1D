# IQUResUNet1D_WLComplex - Widely-linear stem + Complex Mask baseline
#
# Improves IQUResUNet1D_NoASC by adding widely-linear stem convolutions
# and applying estimated complex ratio masks to the mixture input.

model_config:
  model_type: resunet1d_wl_complex

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false
