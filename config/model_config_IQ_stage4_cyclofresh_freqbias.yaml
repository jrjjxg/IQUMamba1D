# IQUMamba1D_CycloFRESHFreqBias - stage-4 IQUMamba with the stage-79
# mixture-estimated FRESH adapter plus a lightweight high-frequency residual
# input adapter.

model_config:
  model_type: iqumamba_cyclofresh_freqbias

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Same metadata-free estimator as stage 79.
  estimated_cyclofresh_min_freq: 0.015625
  estimated_cyclofresh_max_freq: 0.125
  estimated_cyclofresh_default_freq: 0.03125
  estimated_cyclofresh_momentum: 0.05
  estimated_cyclofresh_hidden_channels: 8
  estimated_cyclofresh_kernel_size: 9
  estimated_cyclofresh_scale_init: 0.01
  estimated_cyclofresh_gate_hidden: 8
  estimated_cyclofresh_zero_init: true

  # High-pass residual adapter, added after FRESH and before IQUMamba.
  freqbias_hidden_channels: 8
  freqbias_kernel_size: 9
  freqbias_lowpass_kernel_size: 17
  freqbias_scale_init: 0.01
  freqbias_gate_hidden: 8
  freqbias_zero_init: true
