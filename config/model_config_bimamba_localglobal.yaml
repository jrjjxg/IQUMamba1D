model_config:
  model_type: bimamba_localglobal

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Variant 3: y = x + gate_local * LocalConv(x) + gate_global * BiMamba(x)
  mamba_residual_scale_init: 1.0
  local_kernel_size: 7
  local_global_gate_hidden: 64
