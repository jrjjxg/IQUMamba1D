# Stage 274: replace five late WaveNet blocks from Stage 273 with a low-rate
# global-context path. The first full dilation cycle is retained before Mamba.
# WaveNet(10) -> learned stride-4 UniMamba -> WaveNet(5).
model_config:

  model_type: icassp_wavenet_interleaved_mamba
  input_channels: 2
  # main.py sets this to 2 * num_sources at runtime.
  num_classes: 2

  residual_channels: 128
  residual_layers: 15
  dilation_cycle_length: 10
  mamba_insert_after_block: 10

  mamba_channels: 64
  mamba_downsample_factor: 4
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_dropout: 0.0
  mamba_scale_init: 0.01
