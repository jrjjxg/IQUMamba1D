model_config:
  model_type: bimamba_admm

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # ADMM-unfolded communication-prior separator head.
  #
  # Objective:
  #   min_{S,Z} 0.5 ||sum_k s_k - x_mix||_2^2 + R_comm(Z)
  #   s.t. S = Z
  #
  # Each unfolded layer:
  #   S-update: exact closed-form additive-mixture data consistency
  #   Z-update: learnable communication-prior proximal operator
  #   U-update: scaled dual consistency update
  admm_num_steps: 3
  admm_hidden_channels: 48
  admm_kernel_size: 7
  admm_dropout: 0.0
  admm_tied_steps: true
  admm_rho_init: 1.0
  admm_dual_step_init: 1.0
  admm_prox_step_init: 0.25
