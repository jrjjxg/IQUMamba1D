# IQUBiMamba1D_CSB - Complex Stem + Complex Bottleneck bridge
#
# Rationale from local complex-domain separation papers:
#   - CTDCRN: use complex convolutions at the front-end to preserve I/Q coupling.
#   - C2ESDNet: use complex bottleneck / stacked complex dilated blocks to
#     capture multi-scale temporal structure while keeping computation moderate.
#   - Keep the middle BiMamba U-Net unchanged so the existing skip structure,
#     decoder, and training recipes remain compatible.

model_config:
  model_type: bimamba_csb

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Complex stem on raw IQ
  complex_stem_hidden_channels: 32
  complex_stem_kernel_size: 5

  # Complex refinement bridge at the deepest encoder stage
  complex_bottleneck_hidden_channels: 128
  complex_bottleneck_num_blocks: 3
  complex_bottleneck_kernel_size: 5
  complex_bottleneck_dilation_growth: 2
  # Start near the original BiMamba baseline and let training learn how much
  # complex-domain refinement to use.
  complex_bottleneck_zero_init: true
