# Stage 237: Stage 236 + mixture-only physical-evidence residual gates.
model_config:
  model_type: bimamba_cross_scale_evidence
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  cross_scale_query_stages: [1, 2]
  cross_scale_global_stage: 3
  cross_scale_kv_tokens: 64
  cross_scale_num_heads: 4
  cross_scale_dropout: 0.0
  cross_scale_residual_scale_init: 0.01
  cross_scale_evidence_gate: true
  cross_scale_evidence_hidden: 32
  cross_scale_evidence_eps: 1.0e-6

