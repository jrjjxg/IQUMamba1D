model_config:
  model_type: resunet1d_wavelet_dccb

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # WTConv-style low/high bottleneck context.
  bottleneck_scale_init: 0.05
  wavelet_scale: 0.05
