# Stage 283 (C1): negative control for complexification.
# Strict complex stem, followed by the same 20 ordinary real WaveNet blocks as
# Stage 273. Any gain here comes from the input parameterization alone.
model_config:
  model_type: icassp_complex_wavenet
  input_channels: 2
  num_classes: 2
  residual_channels: 128
  residual_layers: 20
  dilation_cycle_length: 10
  complex_layers: 0
  strict_complex_output: false
  use_conjugate_adapter: false
  complex_norm_enable: false
  complex_norm_eps: 1.0e-6
