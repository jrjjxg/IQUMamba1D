# Stage 228: Stage-4 IQUMamba + source-wise QAM multi-modulus unfolding.
model_config:
  model_type: iqumamba_qam_mma_unrolled
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  qam_mma_hidden_channels: 16
  qam_mma_axis_level_bank: [4, 8]
  qam_mma_include_cross_128: true
  qam_mma_phase_bank: [-0.3926990817, 0.0, 0.3926990817, 0.7853981634]
  qam_mma_num_unroll_steps: 3
  qam_mma_step_init: 0.05
  qam_mma_route_temperature: 8.0
  qam_mma_null_bias: 0.0
  qam_mma_reliability_floor: 0.05
  qam_mma_max_scale: 0.12
  qam_mma_scale_init: 0.005
  qam_mma_kernel_size: 7
