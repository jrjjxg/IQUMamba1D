# Stage 293 / C4: fully phase-equivariant convolutional U-Net, ASC and an
# invariant-feature-driven complex-gain Mamba (full width; magnitude +
# relative-phase inputs, bounded complex-gain output), with a flexible real
# fixed-identity output head.
model_config:
  model_type: iqumamba_stage4_complex
  input_channels: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  num_classes: 4
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  strict_complex_output: false
  use_equivariant_mamba: true
  complex_norm_eps: 1.0e-6
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_max_gain_delta: 0.25
  mamba_max_rotation: 1.5707963267948966
