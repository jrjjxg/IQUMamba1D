# Stage 368 ablation: original four-level Stage-4 + sync-parameter FiLM.
# No cross-SNR pairing, separation consistency, or EMA teacher is used.
model_config:
  model_type: iqumamba_sync_conditioned
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Exact synchronization-conditioning branch used by Stage 366.
  sync_hidden: 48
  sync_lags: [1, 2, 4, 8, 16]
  sync_sps_candidates: [8, 10, 16, 20, 32, 40]
  sync_snr_min_db: -10.0
  sync_snr_max_db: 30.0
  sync_max_cfo_cycles_per_sample: 0.25
  sync_max_phase_drift_rad_per_sample: 0.05
  sync_sps_temperature: 1.0
  sync_film_max_delta: 0.10
  sync_eps: 1.0e-6

  sync_snr_aux_weight: 0.05
  sync_snr_aux_min_db: -10.0
  sync_snr_aux_max_db: 30.0
  sync_snr_aux_beta: 0.1

  # Explicitly disabled to make the ablation auditable.
  cross_snr_enable: false
  cross_snr_ema_teacher_enable: false
  sync_cross_snr_consistency_weight: 0.0

