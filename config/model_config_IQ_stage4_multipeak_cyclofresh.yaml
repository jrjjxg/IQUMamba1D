# IQUMamba1D_MultiPeakCycloFRESH - stage-4 IQUMamba with a multi-peak
# mixture-estimated cyclic-frequency FRESH input adapter.

model_config:
  model_type: iqumamba_multipeak_cyclofresh

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Uses only x=(I,Q).  Branches are [0, +/-f_k, +/-2*f_k] for each peak.
  multipeak_cyclofresh_min_freq: 0.015625
  multipeak_cyclofresh_max_freq: 0.125
  multipeak_cyclofresh_default_freq: 0.03125
  multipeak_cyclofresh_momentum: 0.05
  multipeak_cyclofresh_num_peaks: 2
  multipeak_cyclofresh_guard_bins: 3
  multipeak_cyclofresh_hidden_channels: 8
  multipeak_cyclofresh_kernel_size: 9
  multipeak_cyclofresh_scale_init: 0.01
  multipeak_cyclofresh_gate_hidden: 8
  multipeak_cyclofresh_reliability_floor: 0.25
  multipeak_cyclofresh_zero_init: true
