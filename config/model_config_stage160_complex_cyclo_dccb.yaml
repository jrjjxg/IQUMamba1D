model_config:
  model_type: resunet1d_complex_cyclo_dccb

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Complex cyclic autocorrelation + pseudo-correlation DCCB.
  bottleneck_scale_init: 0.05
  cyclo_scale_init: 0.05
  cyclo_lags: [0, 1, 2, 4, 8, 16]
