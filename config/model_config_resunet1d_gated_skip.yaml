# IQUResUNet1D_GatedSkip - ASC/no-ASC ablation baseline with DG-Gated Skip
#
# Improves IQUResUNet1D_NoASC by introducing Decoder-Guided Gated Skip connections.

model_config:
  model_type: resunet1d_gated_skip

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Decoder-guided gated skip parameters
  gate_kernel_size: 3
  residual_scale_init: 0.1
