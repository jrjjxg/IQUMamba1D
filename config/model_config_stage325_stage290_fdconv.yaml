# Stage325: Stage290 strict-complex stem + Stage309 FDConv at encoder stage0.
model_config:
  model_type: iqumamba_strong_rf_combination
  combination_variant: complex_fdconv
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  complex_norm_eps: 1.0e-6
  rf_residual_scale_init: 0.05
  fdconv_kernel_size: 31
  fdconv_bands: 4
