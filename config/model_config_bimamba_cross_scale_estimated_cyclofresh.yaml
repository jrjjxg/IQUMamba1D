# Stage 239: Stage 235 + Stage-79 mixture-estimated Cyclo-FRESH input adapter.
model_config:
  model_type: bimamba_cross_scale_estimated_cyclofresh
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Stage-235 single-scale compressed-KV cross-attention.
  cross_scale_query_stages: [2]
  cross_scale_global_stage: 3
  cross_scale_kv_tokens: 64
  cross_scale_num_heads: 4
  cross_scale_dropout: 0.0
  cross_scale_residual_scale_init: 0.01
  cross_scale_evidence_gate: false

  # Stage-79 metadata-free cyclic-frequency estimator and residual adapter.
  estimated_cyclofresh_min_freq: 0.015625
  estimated_cyclofresh_max_freq: 0.125
  estimated_cyclofresh_default_freq: 0.03125
  estimated_cyclofresh_momentum: 0.05
  estimated_cyclofresh_hidden_channels: 8
  estimated_cyclofresh_kernel_size: 9
  estimated_cyclofresh_scale_init: 0.01
  estimated_cyclofresh_gate_hidden: 8
  estimated_cyclofresh_zero_init: true

