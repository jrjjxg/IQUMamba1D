# Legacy stage42 ResUNet1D configuration kept for reproducing older strong runs.
# This is not stage4-aligned; use stage42 for the fair stage4-no-Mamba baseline.
model_config:
  model_type: resunet1d

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false
  use_complex_mask: false
