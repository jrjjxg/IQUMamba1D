model_config:
  model_type: iqumamba_delta_linear_encoder

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  use_complex_mask: false

  # Kimi/DeltaNet-style delta-rule linear attention replacement.
  attention_heads: 8
  dropout: 0.0
  residual_scale_init: 0.05
