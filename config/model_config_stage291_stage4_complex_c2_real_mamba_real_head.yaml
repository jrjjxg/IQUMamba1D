# Stage 291 / C2: complex convolutional U-Net and ASC, original real Mamba,
# unconstrained real fixed-identity output head.
model_config:
  model_type: iqumamba_stage4_complex
  input_channels: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  num_classes: 4
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  strict_complex_output: false
  use_equivariant_mamba: false
  complex_norm_eps: 1.0e-6
