# IQUResUNet1D_TimingPrior (Stage 112)
# Stage 56 ResUNet1D_NoASC backbone with a Multi-hypothesis Timing prior adapter.

model_config:
  model_type: resunet1d_timing_prior

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false
  use_complex_mask: false

  # Timing Prior Adapter Configuration
  timing_prior_num_hypotheses: 4
  timing_prior_gate_hidden: 16
  timing_prior_scale_init: 0.01
