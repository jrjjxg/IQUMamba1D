# ICLR 2024 ModernTCN 1D with reparameterized DWConv and two grouped FFNs.
model_config:
  model_type: iqumamba_recent_rf
  rf_module_type: moderntcn
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  rf_residual_scale_init: 0.05
  rf_apply_stages: []
  rf_input_iq: true
  rf_dmodel: 8
  rf_patch_size: 5
  rf_kernel_size: 51
  rf_small_kernel: 5
  rf_expansion: 2
  rf_nvars: 2
