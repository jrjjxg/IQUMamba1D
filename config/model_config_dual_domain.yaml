model_config:

  model_type: dual_domain_mamba
  input_channels: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  num_classes: 4
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  dual_domain_config:
    n_fft: 256
    hop_length: 64
    win_length: 256
    freq_features_per_stage: [16, 32, 64, 128]
    cross_attn_heads: 4
    cross_attn_dropout: 0.0
