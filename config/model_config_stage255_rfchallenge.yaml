# RF Challenge adaptation of Stage 255.
#
# The public ICASSP 2024 task estimates one known complex SOI, so the output
# width is two (I/Q) rather than the project's usual 2-source width of four.
model_config:
  model_type: bimamba_identity_aware_physical_moe
  input_channels: 2
  num_classes: 2
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  fusion_query_stage: 2
  fusion_global_stage: 3
  fusion_global_kv_tokens: 64
  fusion_num_heads: 4
  fusion_dropout: 0.0
  fusion_channel_scale_init: 0.1
  fusion_channel_scale_max: 0.5
  fusion_bottleneck_num_heads: 4
  fusion_bottleneck_dropout: 0.0
  fusion_bottleneck_scale_init: 0.1
  fusion_router_hidden: 64
  fusion_expert_prior: [0.7, 0.1, 0.1, 0.1]

  physical_cyclic_lags: [0, 1, 2, 4, 8]
  physical_polyphase_branches: 8
  physical_symbol_orders: [2, 4, 8]
  physical_min_cyclic_freq: 0.015625
  physical_max_cyclic_freq: 0.125
  physical_cyclic_temperature: 0.25

  # The RF Challenge trainer uses only raw waveform MSE. Disable Stage-255's
  # multi-source route-supervision/counterfactual objectives here; they assume
  # PIT labels and are not part of the competition protocol.
  fusion_trust_penalty_enable: false
  fusion_condition_routing_enable: false
  fusion_counterfactual_enable: false
  fusion_return_route_aux: false
  evidence_moe_route_supervision_enable: false
  stage255_snr_aux_weight: 0.0
  stage255_snr_curriculum_enable: false
