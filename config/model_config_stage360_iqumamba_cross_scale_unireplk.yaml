# Stage 360: Stage-300 unidirectional Mamba Cross-Scale + Stage-310 UniRepLK.
# The U-Net remains four stages; UniRepLK is residual and shape preserving.
model_config:
  model_type: iqumamba_cross_scale_unireplk
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  cross_scale_query_stages: [2]
  cross_scale_global_stage: 3
  cross_scale_kv_tokens: 64
  cross_scale_num_heads: 4
  cross_scale_dropout: 0.0
  cross_scale_residual_scale_init: 0.01
  cross_scale_evidence_gate: false

  rf_residual_scale_init: 0.05
  rf_apply_stages: [0, 1, 2]
  rf_large_kernel: 17
  rf_ffn_factor: 4
  rf_layer_scale: 1.0e-6
