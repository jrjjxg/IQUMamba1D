# IQUComplexUNet1D - pure complex-convolutional 1D U-Net baseline
#
# No Mamba/attention/receiver-prior modules. Internal feature maps remain in
# paired real/imag complex form until the final IQ source-channel output.

model_config:
  model_type: complex_unet1d

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  complex_stem_kernel_size: 5
