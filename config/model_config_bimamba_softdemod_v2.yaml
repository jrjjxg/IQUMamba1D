# IQUBiMamba1D_SoftDemodV2 - receiver-aware Joint BSS + Soft Demodulation
#
# Compared with the baseline softdemod model, this version keeps the same
# separator backbone but replaces the demod head with:
#   1. waveform RMS normalization
#   2. coarse symbol-rate adapter
#   3. contextual symbol modeling
#   4. prototype-based symbol classifier + soft-bit head

model_config:
  model_type: bimamba_softdemod_v2

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Receiver-aware soft demapper parameters
  demod_num_bits: 615
  demod_bits_per_symbol: 3
  demod_hidden: 64
  demod_rnn_hidden: 96
  demod_dropout: 0.2
  demod_adapter_hidden: 96
  demod_symbol_hidden: 128
  demod_context_layers: 2
  demod_symbol_logit_scale: 12.0
  detach_demod: false
