# Stage328: Stage197 BiMamba Estimated CycloFRESH + Stage310 UniRepLK.
model_config:
  model_type: iqumamba_strong_rf_combination
  combination_variant: bimamba_cyclofresh_unireplk
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
