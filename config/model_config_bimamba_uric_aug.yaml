model_config:
  model_type: bimamba_uric_aug

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Unrolled residual interference-cancellation (same as stage 40)
  ric_num_steps: 3
  ric_hidden_channels: 48
  ric_kernel_size: 7
  ric_dropout: 0.0
  ric_tied_steps: true
  ric_step_init: 0.5
  ric_return_intermediate: false
  ric_update_block_type: conv        # conv | dilated_gated | cross_attention
  ric_dilations: [1, 2, 4]           # used by dilated_gated
  ric_num_heads: 4                   # used by cross_attention
  ric_attention_stride: 1            # >1 downsamples K/V context to save memory
  ric_ffn_multiplier: 2              # used by cross_attention

  # Lightweight train-only RF augmentation defaults
  # Chosen for strong invariance/coverage at negligible runtime overhead.
  train_aug_enable: true
  train_aug_source_phase_jitter_deg: 12.0
  train_aug_source_gain_jitter_db: 1.0
  train_aug_max_common_time_shift: 8
  train_aug_global_phase_rotation: true

  # Optional online mixture-level augmentation (command-line controlled)
  train_mix_enable: false
  train_mix_prob: 0.0
  train_mix_sir_min_db: -3.0
  train_mix_sir_max_db: 3.0
  train_mix_cross_sample: false
