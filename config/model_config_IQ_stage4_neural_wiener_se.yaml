# IQUMamba1D Stage 208 - neural Wiener low-SNR front-end.
model_config:
  model_type: iqumamba_neural_wiener_se

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # The gain starts near identity: exp(3)/(exp(3)+exp(-3)) ~= 0.998.
  wiener_hidden_channels: 16
  wiener_kernel_size: 9
  wiener_signal_bias_init: 3.0
  wiener_noise_bias_init: -3.0
  wiener_log_power_clip: 8.0
  wiener_use_projection: true
  wiener_project_during_train: false
  wiener_project_during_eval: true
  wiener_source_weight: 0.25
  wiener_noise_weight: 1.0
  wiener_return_aux: false
  wiener_eps: 1.0e-8
