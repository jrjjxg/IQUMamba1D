# IQUBiMamba1D_Jamba — Hybrid BiMamba + Attention (Jamba-style)
#
# Architecture:
#   Stage 0: BiMamba  (seq len = 4096)
#   Stage 1: Identity
#   Stage 2: BiMamba  (seq len = 1024)
#   Stage 3: Identity
#   Stage 4: ★ MHA   (seq len = 256, bottleneck — cheap attention here)
#
# Attention at the bottleneck is efficient (256 tokens → 256² = 65K ops)
# while providing exact pairwise token interaction for global context.

model_config:
  model_type: bimamba_jamba

  input_channels: 2
  num_classes: 4
  n_stages: 5
  features_per_stage: [32, 64, 128, 256, 320]
  kernel_sizes: [3, 3, 3, 3, 3]
  strides: [1, 2, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 2, 2]
  deep_supervision: false

  # Jamba-specific: which stages use Attention instead of BiMamba
  attn_stages: [4]       # bottleneck only (cheapest, most impactful)
  attn_n_heads: 4        # number of attention heads
  attn_dropout: 0.0      # attention/FFN dropout
  attn_ffn_expand: 4     # FFN hidden = dim × expand
