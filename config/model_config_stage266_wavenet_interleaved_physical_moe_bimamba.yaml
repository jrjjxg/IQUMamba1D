# Stage 266: retain Stage 261's local unidirectional Mamba context and add a
# Stage-255-inspired identity/global/physical/joint residual MoE.  Its global
# memory is a separate stride-4 bidirectional Mamba branch; the physical expert
# sees only the raw mixture I/Q and does not use source labels or metadata.
model_config:
  model_type: icassp_wavenet_interleaved_physical_moe_bimamba
  input_channels: 2
  # main.py sets this to 2 * num_sources at runtime.
  num_classes: 2

  residual_channels: 128
  residual_layers: 20
  dilation_cycle_length: 10
  mamba_insert_after_block: 10

  # Unchanged Stage-261 local context path.
  mamba_channels: 64
  mamba_downsample_factor: 4
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_dropout: 0.0
  mamba_scale_init: 0.01

  # Stage-255-style global/physical/joint residual experts and identity prior.
  fusion_global_kv_tokens: 64
  fusion_num_heads: 4
  fusion_dropout: 0.0
  fusion_channel_scale_init: 0.1
  fusion_channel_scale_max: 0.5
  fusion_router_hidden: 64
  fusion_expert_prior: [0.7, 0.1, 0.1, 0.1]
  fusion_condition_hidden: 16
  fusion_condition_embedding: 16
  fusion_trust_penalty_init: 0.1
  fusion_trust_penalty_enable: true
  fusion_condition_routing_enable: true

  # Mixture-only physical evidence bank.
  physical_cyclic_lags: [0, 1, 2, 4, 8]
  physical_polyphase_branches: 8
  physical_symbol_orders: [2, 4, 8]
  physical_min_cyclic_freq: 0.015625
  physical_max_cyclic_freq: 0.125
  physical_cyclic_temperature: 0.25
