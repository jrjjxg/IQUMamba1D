# Stage320: exact Stage4 encoder/decoder control with every encoder Mamba removed.
model_config:
  model_type: iqumamba_fdconv_unirep_ablation
  rf_variant: no_mamba
  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false
  rf_residual_scale_init: 0.05
