# IQUMamba1D Stage 210 - null-aware multi-hypothesis cyclic reliability adapter.
model_config:
  model_type: iqumamba_multihyp_cyclic_reliability

  input_channels: 2
  num_classes: 4
  n_stages: 4
  features_per_stage: [32, 64, 128, 256]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 2, 2, 2]
  n_conv_per_stage: [2, 2, 2, 2]
  n_conv_per_stage_decoder: [2, 2, 1, 1]
  deep_supervision: false

  # Candidate normalized cyclic frequencies in cycles/sample. The adapter also
  # has an explicit null hypothesis so unreliable cyclic evidence can be ignored.
  multihyp_cyclic_freqs: [0.015625, 0.03125, 0.0625, 0.125]
  multihyp_cyclic_hidden_channels: 8
  multihyp_cyclic_kernel_size: 9
  multihyp_cyclic_scale_init: 0.01
  multihyp_cyclic_gate_hidden: 8
  multihyp_cyclic_temperature: 0.5
  multihyp_cyclic_null_logit_init: 2.0
  multihyp_cyclic_local_bins: 5
  multihyp_cyclic_zero_init: true
  multihyp_cyclic_return_aux: false
  multihyp_cyclic_eps: 1.0e-8
